name: Сборка и тесты

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  windows:
    name: Windows — тесты и приложение
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Интерфейс — зависимости, тесты, сборка
        working-directory: ui
        run: |
          npm ci
          npm test
          npm run build

      - name: Тесты .NET (на Windows)
        run: dotnet test Pepa.slnx -c Release

      - name: Публикация приложения
        run: dotnet publish src/Pepa.Desktop/Pepa.Desktop.csproj -c Release -r win-x64 --self-contained true -o out/Pepa -p:DebugType=None -p:GenerateDocumentationFile=false

      - name: Проверка состава приложения
        shell: pwsh
        run: |
          foreach ($file in @("Pepa.exe", "wwwroot/index.html", "Microsoft.Web.WebView2.Core.dll", "e_sqlite3.dll")) {
            if (-not (Test-Path "out/Pepa/$file")) { throw "В сборке нет $file" }
          }
          Copy-Item README.md out/Pepa/README.md

      - uses: actions/upload-artifact@v7
        with:
          name: Pepa-win-x64
          path: out/Pepa
          retention-days: 30

  linux:
    name: Linux — тесты и сквозная проверка интерфейса
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Интерфейс — зависимости, проверка типов, тесты, сборка
        working-directory: ui
        run: |
          npm ci
          npm test
          npm run build

      - name: Тесты .NET
        run: dotnet test Pepa.slnx

      - name: Сквозная проверка интерфейса (Playwright)
        working-directory: ui
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          npm run e2e

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-screenshots
          path: ui/e2e/screenshots
          retention-days: 14
